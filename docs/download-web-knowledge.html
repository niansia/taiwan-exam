<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://raw.githubusercontent.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>下載 Taiwan Exam 網頁版知識檔</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #17202a; }
    main { width: min(38rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #d8dee4; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem rgba(23, 32, 42, .10); }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { line-height: 1.7; }
    button, a.button { display: inline-block; box-sizing: border-box; padding: .8rem 1rem; border: 0; border-radius: .55rem; background: #0969da; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:hover, a.button:hover { background: #0550ae; }
    small { display: block; margin-top: 1.25rem; line-height: 1.55; color: #57606a; }
    #status { min-height: 1.7em; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      main { background: #161b22; border-color: #30363d; box-shadow: none; }
      small { color: #9da7b3; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Taiwan Exam 網頁版知識檔</h1>
    <p id="status" role="status" aria-live="polite">正在準備下載……</p>
    <p><button id="download" type="button">再次下載知識檔</button></p>
    <p>若 AI 無法連網下載模板，可把離線資源 PDF 附到出卷對話。它內含 30 個原始 PDF 附件，約 3.5 MB，不含程式；AI 只取用當科。安裝時不必下載。</p>
    <p><button id="templates" type="button">下載離線模板資源 PDF</button></p>
    <small>版本：2026.09.13.4<br>知識檔：taiwan-exam-web-knowledge.md<br>模板備援：taiwan-exam-template-resources.pdf<br>不是 ZIP 或執行檔。平台仍需能建立、解出及檢查 PDF。請用新知識檔更新原本已儲存的 Skill。</small>
    <noscript><p>瀏覽器已停用 JavaScript。請改用<a class="button" href="https://raw.githubusercontent.com/niansia/taiwan-exam/main/web/taiwan-exam-web-knowledge.md?v=2026.09.13.4">開啟原始文字</a>或<a href="https://raw.githubusercontent.com/niansia/taiwan-exam/main/web/taiwan-exam-template-resources.pdf">開啟模板資源 PDF</a>，再使用瀏覽器的另存功能。</p></noscript>
  </main>
  <script>
    const sourceUrl = "https://raw.githubusercontent.com/niansia/taiwan-exam/main/web/taiwan-exam-web-knowledge.md?v=2026.09.13.4";
    const filename = "taiwan-exam-web-knowledge.md";
    const templateUrl = "https://raw.githubusercontent.com/niansia/taiwan-exam/main/web/taiwan-exam-template-resources.pdf?v=2026.09.13.4";
    const status = document.getElementById("status");
    const button = document.getElementById("download");
    const templateButton = document.getElementById("templates");

    async function downloadKnowledge() {
      button.disabled = true;
      status.textContent = "正在準備下載……";
      try {
        const response = await fetch(sourceUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        if (blob.size < 100000) throw new Error("檔案內容不完整");
        const objectUrl = URL.createObjectURL(new Blob([blob], { type: "text/markdown;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        status.textContent = "下載已開始。完成後可把檔案上傳到 ChatGPT、Claude 或 Gemini。";
      } catch (error) {
        status.textContent = "自動下載失敗，請稍後再按一次；若仍失敗，請回到專案頁回報。";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", downloadKnowledge);
    async function downloadTemplates() {
      templateButton.disabled = true;
      status.textContent = "正在下載離線模板資源 PDF……";
      try {
        const response = await fetch(templateUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        if (blob.size < 1000000 || await blob.slice(0, 5).text() !== "%PDF-") throw new Error("PDF 不完整");
        const objectUrl = URL.createObjectURL(new Blob([blob], { type: "application/pdf" }));
        const link = document.createElement("a");
        link.href = objectUrl;
        link.download = "taiwan-exam-template-resources.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        status.textContent = "模板資源下載已開始。請附到出卷對話，並使用最新版知識檔。";
      } catch (error) {
        status.textContent = "模板下載失敗，請稍後再按一次；不需要自行到 GitHub 找檔案。";
      } finally {
        templateButton.disabled = false;
      }
    }
    templateButton.addEventListener("click", downloadTemplates);
    // One click starts only the selected download, avoiding multi-download blocks.
    if (location.hash === "#templates") downloadTemplates();
    else downloadKnowledge();
  </script>
</body>
</html>
