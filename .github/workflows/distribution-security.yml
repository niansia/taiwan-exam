name: Distribution security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  scan-download:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update Defender intelligence
        shell: pwsh
        run: Update-MpSignature -ErrorAction Stop
      - name: Scan exact distributed archive and extracted contents
        shell: pwsh
        run: python scripts/scan_skill_release.py downloads/taiwan-exam-generator.zip --report security-check.json
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-security
          path: security-check.json
          if-no-files-found: error
